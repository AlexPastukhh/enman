<svg xmlns="http://www.w3.org/2000/svg" width="700" height="80" viewBox="0 0 700 80">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="14" y="22" font-family="Arial" font-size="14" fill="#222">Email validation pattern</text>
  <text x="14" y="46" font-family="Courier New" font-size="12" fill="#111">^[\w.-]+@[\w.-]+\.[a-zA-Z]{2,}$</text>
</svg>