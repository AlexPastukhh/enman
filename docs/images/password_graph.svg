<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="20" font-family="Arial" font-size="16" fill="#111">Password entropy (bits) vs length</text>
  <g transform="translate(40,40)">
    <line x1="0" y1="120" x2="520" y2="120" stroke="#ccc" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="120" stroke="#ccc" stroke-width="1"/>
    <!-- bars for lengths 4,8,12,16 -->
    <rect x="20" y="80" width="60" height="40" fill="#3498db"/>
    <rect x="120" y="40" width="60" height="80" fill="#3498db"/>
    <rect x="220" y="10" width="60" height="110" fill="#3498db"/>
    <rect x="320" y="0" width="60" height="120" fill="#3498db"/>
    <text x="40" y="135" font-family="Arial" font-size="12">L=4</text>
    <text x="140" y="135" font-family="Arial" font-size="12">L=8</text>
    <text x="240" y="135" font-family="Arial" font-size="12">L=12</text>
    <text x="340" y="135" font-family="Arial" font-size="12">L=16</text>
  </g>
</svg>