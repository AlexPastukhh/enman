<svg xmlns="http://www.w3.org/2000/svg" width="640" height="140" viewBox="0 0 640 140">
  <rect width="100%" height="100%" fill="#fff"/>
  <g font-family="Segoe UI, Arial" fill="#0b1220">
    <text x="12" y="20" font-size="16" font-weight="600">Phone Validation (Regex)</text>
    <text x="12" y="48" font-size="13" fill="#334155">Пример шаблона: ^\+?\d{10,15}$</text>
    <rect x="12" y="64" width="600" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="88" font-size="13" fill="#0f172a">+7 912 345 6789 — соответствует</text>
    <text x="24" y="108" font-size="13" fill="#0f172a">(123) 456-7890 — не соответствует</text>
  </g>
</svg>
